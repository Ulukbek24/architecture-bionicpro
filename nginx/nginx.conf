worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile          on;
    tcp_nopush        on;
    server_tokens     off;
    keepalive_timeout 65;

    # Cache layer in front of S3 (acts as a lightweight CDN edge).
    proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=cdn_cache:50m max_size=2g inactive=24h use_temp_path=off;

    log_format main '$remote_addr - $upstream_cache_status [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    upstream session_backend {
        server session-backend:8000;
    }

    upstream reports_api {
        server reports-api:8001;
    }

    upstream frontend_upstream {
        server frontend:3000;
    }

    upstream s3_origin {
        server minio:9000;
    }

    server {
        listen 80 default_server;
        server_name _;

        # SPA / static frontend
        location / {
            proxy_pass         http://frontend_upstream;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Auth + session API
        location /auth/ {
            proxy_pass         http://session_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Application API (reports etc.)
        location /api/ {
            proxy_pass         http://session_backend/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # CDN edge in front of object storage. Heavy report artifacts are
        # served from here instead of hitting Postgres or the API.
        location /cdn/ {
            proxy_pass         http://s3_origin/;
            proxy_set_header   Host $host;
            proxy_cache        cdn_cache;
            proxy_cache_valid  200 206 12h;
            proxy_cache_valid  404 1m;
            proxy_cache_lock   on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header         X-Cache-Status $upstream_cache_status always;
            expires            12h;
        }

        # Direct path to reports-api for service-to-service calls or admins.
        location /reports-api/ {
            proxy_pass         http://reports_api/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
